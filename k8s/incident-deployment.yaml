apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: incident-service
  template:
    metadata:
      labels:
        app: incident-service
    spec:
      containers:
        - name: incident-service
          image: resqlink-main-incident-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: MONGODB_URL
              valueFrom:
                secretKeyRef:
                  name: resqlink-secret
                  key: MONGODB_URL
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: resqlink-secret
                  key: JWT_SECRET_KEY
            - name: RESOURCE_SERVICE_URL
              value: "http://resource-service:8001"
            - name: FRONTEND_URL
              value: "http://frontend-service"