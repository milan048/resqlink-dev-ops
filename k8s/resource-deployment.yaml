apiVersion: apps/v1
kind: Deployment
metadata:
  name: resource-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: resource-service
  template:
    metadata:
      labels:
        app: resource-service
    spec:
      containers:
        - name: resource-service
          image: resqlink-main-resource-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8001
          env:
            - name: MONGODB_URL
              valueFrom:
                secretKeyRef:
                  name: resqlink-secret
                  key: MONGODB_URL
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: resqlink-secret
                  key: JWT_SECRET_KEY
            - name: FRONTEND_URL
              value: "http://frontend-service"