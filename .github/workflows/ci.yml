name: ResQLink CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  backend-test:
    name: Backend Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Verify Incident Service
        working-directory: incident-service
        run: |
          python -m compileall app

      - name: Verify Resource Service
        working-directory: resource-serivice
        run: |
          python -m compileall app

      - name: Run automated tests
        run: |
          pytest tests -v

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Package frontend
        working-directory: frontend
        run: |
          tar -czf ../resqlink-frontend-build.tar.gz dist

  ci-summary:
    name: CI Pipeline Summary
    runs-on: ubuntu-latest

    needs:
      - backend-test
      - frontend-build

    steps:
      - name: CI completed successfully
        run: |
          echo "================================="
          echo "ResQLink CI Pipeline Successful"
          echo "================================="
          echo "Build -> Test -> Package"
